<style>
/* Nur die Ergaenzungen fuer die Staedte-Auswahl. Alles Uebrige kommt aus dem
   eingesetzten Stilblock der Wartungsseite. Die Namen der Platzhalter duerfen
   hier NICHT auftauchen: sie wuerden beim Bauen mitersetzt und dieses
   Stil-Element von innen heraus schliessen. Genau das ist am 14.08.2026
   passiert und erst im Browser aufgefallen. */
body { align-items: flex-start; }
.wrap { padding-top: 64px; padding-bottom: 64px; max-width: 720px; }
.staedte {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
  margin: 8px 0 8px;
  text-align: left;
}
.stadt {
  display: block;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 12px;
  padding: 20px 22px;
  text-decoration: none;
  color: inherit;
  transition: background .15s, border-color .15s;
}
a.stadt:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.24); }
.stadt-name {
  font-size: 19px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 6px;
}
.stadt-status { font-size: 13px; color: #a0aec0; line-height: 1.5; }
.stadt-marke {
  display: inline-block;
  margin-top: 12px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  letter-spacing: .4px;
  text-transform: uppercase;
}
.marke-archiv { background: rgba(214,40,40,.15); border: 1px solid rgba(214,40,40,.35); color: #f8b4b4; }
.marke-vorbereitung { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); color: #cbd5e0; }
.marke-live { background: rgba(39,103,73,.15); border: 1px solid rgba(39,103,73,.3); color: #81e6a8; }
</style>
</head>

<div class="wrap">

  <p>Der Müll-Monitor wertet öffentlich gemeldete Müllablagerungen je Stadt aus. Bitte eine Stadt auswählen.</p>
